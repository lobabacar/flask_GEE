<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Dashboard GEE - OpenLayers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>
    <style>
        #map { width: 100%; height: 500px; background: #eee; }
        .controls { padding: 10px; background: #2c3e50; color: white; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="date" id="dateInput" value="2023-06-01">
        <button onclick="updateNDVI()">Afficher NDVI</button>
    </div>
    
    <div id="map"></div>

    <script>
        // 1. Initialisation de la carte OpenLayers
        const map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM() // Fond de carte
                })
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([-17.44, 14.69]),
                zoom: 12
            })
        });

        let ndviLayer; // Garder une référence pour la supprimer

        function updateNDVI() {
            const date = document.getElementById('dateInput').value;

            fetch('/get_ndvi_tile', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({date: date})
            })
            .then(res => res.json())
            .then(data => {
                if (data.tile_url) {
                    // Supprimer l'ancienne couche si elle existe
                    if (ndviLayer) map.removeLayer(ndviLayer);

                    // 2. Ajouter la couche GEE comme source XYZ
                    ndviLayer = new ol.layer.Tile({
                        source: new ol.source.XYZ({
                            url: data.tile_url
                        }),
                        opacity: 0.7
                    });
                    map.addLayer(ndviLayer);
                }
            })
            .catch(err => alert("Erreur lors de la récupération du NDVI"));
        }
    </script>
</body>
</html>
