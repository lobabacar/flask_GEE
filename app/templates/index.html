<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard NDVI - OpenLayers + Flask + GEE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div id="app">
    <div id="sidebar">
        <h2>Dashboard NDVI</h2>
        <p class="muted">Analyse de végétation par zone dessinée avec Google Earth Engine.</p>

        <h3>Paramètres</h3>

        <div class="control-group">
            <label for="datePicker">Date cible</label>
            <input type="date" id="datePicker" value="2023-06-30">
        </div>

        <div class="control-group">
            <button id="drawPolygonBtn">Dessiner un polygone</button>
            <button id="drawRectangleBtn" class="secondary">Dessiner un rectangle</button>
            <button id="clearBtn" class="danger">Effacer la zone</button>
            <button id="showNdviBtn">Afficher NDVI</button>
        </div>

        <div id="statusBox">
            <h3>État</h3>
            <p id="statusMessage" class="muted">Prêt.</p>
        </div>

        <div id="statsBox">
            <h3>Statistiques NDVI</h3>
            <div class="stat-item"><span>Moyenne</span><span id="ndviMean">-</span></div>
            <div class="stat-item"><span>Minimum</span><span id="ndviMin">-</span></div>
            <div class="stat-item"><span>Maximum</span><span id="ndviMax">-</span></div>
            <div class="stat-item"><span>Écart-type</span><span id="ndviStd">-</span></div>
            <div class="stat-item"><span>Images trouvées</span><span id="imgCount">-</span></div>
            <div class="stat-item"><span>Fenêtre</span><span id="dateWindow">-</span></div>
        </div>
    </div>

    <div id="map-container">
        <div id="map"></div>

        <div id="legend">
            <h4>Légende NDVI</h4>
            <div><span style="background:#0000ff"></span> Eau / très faible</div>
            <div><span style="background:#ffffff"></span> Sol nu</div>
            <div><span style="background:#ffff00"></span> Végétation faible</div>
            <div><span style="background:#00ff00"></span> Végétation moyenne</div>
            <div><span style="background:#006400"></span> Végétation dense</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
